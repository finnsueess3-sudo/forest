<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8" />
<title>Forest Game</title>
<meta name="viewport" content="width=device-width,initial-scale=1" />
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Loadscreen + PIN -->
<div id="loadscreen">
  <h1>Forest Game</h1>
  <p>Gib den PIN ein, um zu spielen:</p>
  <input type="password" id="pinInput" placeholder="PIN">
  <button id="pinButton">OK</button>
  <p id="pinMsg"></p>
</div>

<!-- Overlay -->
<div id="overlay" style="display:none;">
  <div id="health">HP: 100</div>
  <div id="info">WASD = laufen • Shift = Sprint • Linke Maustaste = Schwert • R = Bogen</div>
  <div id="center">Click to play</div>
</div>

<!-- Skript -->
<script type="module" src="scripts.js"></script>
<script src="/socket.io/socket.io.js"></script>
</body>
</html>
